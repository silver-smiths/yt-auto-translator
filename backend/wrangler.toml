name = "yt-auto-translator-api"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"

# 자가수복 워처(5분) + 추천 페이백 일일 적립(KST 00:00 = UTC 15:00) — scheduled 핸들러가 event.cron으로 분기
[triggers]
crons = ["*/5 * * * *", "0 15 * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true

[vars]
ENVIRONMENT = "production"
GEMINI_MODEL = "gemini-2.5-flash"
# Gemini 릴레이 — Workers(홍콩 라우팅 위험)가 Vercel(미국 iad1)을 경유해 Gemini 호출
GEMINI_RELAY_URL = "https://backend-three-alpha-60.vercel.app/gemini/relay"

# Secrets (wrangler secret put 으로 등록)
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# GEMINI_API_KEY           ← 개발자 소유 키
# PORTONE_WEBHOOK_SECRET
# EXCHANGE_RATE_API_KEY    ← KRW→USD 환율 (선택)
