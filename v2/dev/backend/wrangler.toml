name = "yt-auto-translator-api"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[limits]
max_duration = 120

[vars]
ENVIRONMENT = "production"

# Secrets (set via: wrangler secret put <NAME>)
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# GEMINI_API_KEY
# OPENAI_API_KEY        ← v2.x, 미설정 시 폴백 skip
# PORTONE_SECRET_KEY
# TELEGRAM_BOT_TOKEN
# TELEGRAM_CHAT_ID
# LOG_SECRET
